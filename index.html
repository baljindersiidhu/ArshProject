<style>
/* ── Reset & Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:'DM Sans',sans-serif;background:#0B1220;color:#fff;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ── CSS Variables ── */
:root{
  --navy:#0B1220;
  --navy2:#0f1a2e;
  --navy3:#13243d;
  --blue:#2563EB;
  --blue-light:#3b82f6;
  --blue-glow:rgba(37,99,235,0.3);
  --white:#FFFFFF;
  --gray:#94a3b8;
  --gray-light:#e2e8f0;
  --border:rgba(255,255,255,0.08);
}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#0B1220}
::-webkit-scrollbar-thumb{background:#2563EB;border-radius:2px}

/* ── Typography Helpers ── */
.font-display{font-family:'Syne',sans-serif}
.gradient-text{background:linear-gradient(135deg,#fff 0%,#93c5fd 50%,#2563EB 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* ── Visual Helpers ── */
.gradient-blue{background:linear-gradient(135deg,#1d4ed8 0%,#2563EB 50%,#3b82f6 100%)}
.glass{background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08)}
.glow-blue{box-shadow:0 0 40px rgba(37,99,235,0.3),0 0 80px rgba(37,99,235,0.1)}

/* ── Section Tag ── */
.section-tag{display:inline-flex;align-items:center;gap:8px;background:rgba(37,99,235,0.12);border:1px solid rgba(37,99,235,0.3);border-radius:100px;padding:6px 16px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#93c5fd;margin-bottom:20px}
.section-tag::before{content:'';width:6px;height:6px;background:#2563EB;border-radius:50%;flex-shrink:0}

/* ── Buttons ── */
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#1d4ed8,#2563EB);color:#fff;padding:14px 28px;border-radius:10px;font-weight:600;font-size:15px;text-decoration:none;border:none;cursor:pointer;transition:all .3s;box-shadow:0 4px 20px rgba(37,99,235,0.4)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(37,99,235,0.5)}
.btn-outline{display:inline-flex;align-items:center;gap:8px;background:transparent;color:#fff;padding:13px 28px;border-radius:10px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid rgba(255,255,255,0.2);cursor:pointer;transition:all .3s}
.btn-outline:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.4);transform:translateY(-2px)}

/* ── Form Elements ── */
input,select,textarea{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#fff;padding:14px 18px;font-family:'DM Sans',sans-serif;font-size:15px;width:100%;transition:border-color .3s;outline:none}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,0.35)}
input:focus,select:focus,textarea:focus{border-color:#2563EB;background:rgba(37,99,235,0.08)}
select option{background:#0f1a2e;color:#fff}

/* ── Animations ── */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse-ring{0%{transform:scale(1);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes counter{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes slide-up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes spin-slow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.animate-float{animation:float 4s ease-in-out infinite}
.animate-fade{animation:fade-in .8s ease forwards}
.animate-slide{animation:slide-up .7s ease forwards}

/* ── Progress Bar ── */
.progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#2563EB,#60a5fa);z-index:9999;transition:width .1s}

/* ── Service Card ── */
.service-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:28px;transition:all .4s;position:relative;overflow:hidden;cursor:pointer}
.service-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(37,99,235,0.08),transparent);opacity:0;transition:opacity .4s}
.service-card:hover{transform:translateY(-6px);border-color:rgba(37,99,235,0.4);box-shadow:0 20px 60px rgba(37,99,235,0.15)}
.service-card:hover::before{opacity:1}

/* ── Testimonial Card ── */
.testimonial-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:32px;transition:all .4s}
.testimonial-card:hover{transform:translateY(-4px);border-color:rgba(37,99,235,0.3)}

/* ── FAQ ── */
.faq-item{border:1px solid rgba(255,255,255,0.08);border-radius:12px;overflow:hidden;margin-bottom:12px}
.faq-btn{width:100%;text-align:left;background:rgba(255,255,255,0.03);color:#fff;padding:20px 24px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:500;display:flex;justify-content:space-between;align-items:center;transition:background .3s}
.faq-btn:hover{background:rgba(255,255,255,0.06)}
.faq-content{background:rgba(255,255,255,0.02);padding:0 24px;max-height:0;overflow:hidden;transition:all .4s;color:var(--gray);font-size:15px;line-height:1.7}
.faq-content.open{max-height:200px;padding:20px 24px}

/* ── Floating Buttons ── */
.whatsapp-btn{position:fixed;bottom:28px;right:28px;width:60px;height:60px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:1000;box-shadow:0 4px 20px rgba(37,211,102,0.4);text-decoration:none;transition:transform .3s}
.whatsapp-btn:hover{transform:scale(1.1)}
.whatsapp-btn::before{content:'';position:absolute;width:60px;height:60px;background:#25D366;border-radius:50%;animation:pulse-ring 2s ease-out infinite;opacity:.5}
.back-top{position:fixed;bottom:100px;right:28px;width:44px;height:44px;background:rgba(37,99,235,0.8);border:1px solid rgba(37,99,235,0.5);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:999;cursor:pointer;transition:all .3s;font-size:18px}
.back-top:hover{background:#2563EB;transform:translateY(-3px)}

/* ── Sticky Mobile Call ── */
.sticky-call{display:none;position:fixed;bottom:0;left:0;right:0;z-index:1000;background:linear-gradient(135deg,#1d4ed8,#2563EB);padding:14px;text-align:center;font-weight:700;font-size:16px;text-decoration:none;color:#fff}
@media(max-width:768px){.sticky-call{display:block}}

/* ── Grid Helpers ── */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}

/* ── Navbar ── */
nav{position:fixed;top:44px;left:0;right:0;z-index:100;transition:all .4s}
nav.scrolled{top:0;background:rgba(11,18,32,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);box-shadow:0 4px 30px rgba(0,0,0,0.3)}
.nav-inner{max-width:1280px;margin:0 auto;padding:0 24px;height:72px;display:flex;align-items:center;justify-content:space-between}
.nav-links{display:flex;align-items:center;gap:36px}
.nav-links a{color:rgba(255,255,255,0.75);text-decoration:none;font-size:15px;font-weight:500;transition:color .3s;position:relative}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:2px;background:#2563EB;transition:width .3s;border-radius:2px}
.nav-links a:hover{color:#fff}
.nav-links a:hover::after{width:100%}
@media(max-width:900px){.nav-links{display:none}}

/* ── Mobile Menu ── */
.mobile-menu{display:none;position:fixed;inset:0;background:rgba(11,18,32,0.98);z-index:200;flex-direction:column;align-items:center;justify-content:center;gap:32px}
.mobile-menu.open{display:flex}
.mobile-menu a{color:#fff;font-size:28px;font-family:'Syne',sans-serif;font-weight:700;text-decoration:none;opacity:0;animation:slide-up .5s ease forwards}

/* ── Section & Container ── */
section{padding:100px 24px}
.container{max-width:1280px;margin:0 auto}

/* ── Hero ── */
.hero-badge{display:inline-flex;align-items:center;gap:10px;background:rgba(37,99,235,0.15);border:1px solid rgba(37,99,235,0.4);border-radius:100px;padding:10px 20px;font-size:13px;font-weight:600;color:#93c5fd;margin-bottom:32px}
.hero-badge-dot{width:8px;height:8px;background:#2563EB;border-radius:50%;animation:blink 2s ease-in-out infinite}

/* ── Stat ── */
.stat-num{font-family:'Syne',sans-serif;font-size:52px;font-weight:800;line-height:1;color:#fff}

/* ── Gallery ── */
.gallery-item{border-radius:16px;overflow:hidden;position:relative;background:#13243d;aspect-ratio:4/3}
.gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gallery-item:hover img{transform:scale(1.06)}
.gallery-item .overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(11,18,32,0.8),transparent);opacity:0;transition:opacity .4s;display:flex;align-items:flex-end;padding:20px}
.gallery-item:hover .overlay{opacity:1}

/* ── City Chip ── */
.city-chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 20px;font-size:15px;font-weight:500;color:rgba(255,255,255,0.85);transition:all .3s}
.city-chip:hover{background:rgba(37,99,235,0.15);border-color:rgba(37,99,235,0.4);color:#fff}

/* ── Icon Box ── */
.icon-box{width:56px;height:56px;background:rgba(37,99,235,0.15);border:1px solid rgba(37,99,235,0.3);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:20px;transition:all .4s;flex-shrink:0}
.service-card:hover .icon-box{background:rgba(37,99,235,0.3);transform:scale(1.1)}

.star{color:#f59e0b;font-size:16px}

.banner-mobile  { display: none; }
.banner-desktop { display: block; }

/* ── Footer ── */
footer{background:#060d1a;border-top:1px solid rgba(255,255,255,0.06)}

/* ─────────────────────────────────────────────
   RESPONSIVE BREAKPOINTS
───────────────────────────────────────────── */

/* ── 1280px: Constrain max widths ── */
@media(max-width:1280px){
  .container{padding:0 32px}
}

/* ── 1024px: Tablet landscape ── */
@media(max-width:1024px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(2,1fr)}

  /* Hero right visual – reduce size */
  .hero-right-card{
    width:clamp(220px,30%,380px) !important;
    right:-10% !important;
  }

  /* Why Us two-col grid */
  .why-us-grid{
    grid-template-columns:1fr !important;
    gap:40px !important;
  }

  /* About two-col grid */
  .about-grid{
    grid-template-columns:1fr !important;
    gap:40px !important;
  }

  /* Contact two-col grid */
  .contact-grid{
    grid-template-columns:1fr !important;
    gap:40px !important;
  }

  /* Stats grid */
  .stats-inner{
    grid-template-columns:repeat(2,1fr) !important;
  }
  .stats-inner > div:nth-child(2){
    border-right:none !important;
  }
  .stats-inner > div:nth-child(odd){
    border-right:1px solid rgba(255,255,255,0.07) !important;
  }
}

/* ── 768px: Tablet portrait / large phone ── */
@media(max-width:768px){
  section{padding:72px 20px !important}

  /* Typography scale */
  h1{font-size:clamp(34px,9vw,52px) !important;line-height:1.1 !important}
  h2{font-size:clamp(26px,7vw,38px) !important;line-height:1.2 !important}
  h3{font-size:clamp(16px,4vw,22px) !important}

  /* Buttons: full width on mobile hero, normal elsewhere */
  .hero-ctas{flex-direction:column !important;align-items:stretch !important}
  .hero-ctas .btn-primary,
  .hero-ctas .btn-outline,
  .hero-ctas a{width:100% !important;justify-content:center !important;text-align:center !important}

  /* Navbar */
  .nav-inner{padding:0 18px !important;height:64px !important}
  nav{top:38px !important}
  nav.scrolled{top:0 !important}

  /* Emergency banner */
  .emergency-banner{font-size:11px !important;padding:8px 14px !important;line-height:1.5}

  /* Hero adjustments */
  .hero-right-card{display:none !important} /* hide floating card on mobile */
  .hero-trust-strip{flex-direction:row !important;flex-wrap:wrap !important;gap:16px !important}

  /* Glass padding */
  .glass{padding:24px !important}

  /* Contact form grid */
  .form-row-2{grid-template-columns:1fr !important}

  /* WhatsApp + back-top */
  .whatsapp-btn{width:52px;height:52px;right:16px;bottom:76px}
  .whatsapp-btn::before{width:52px;height:52px}
  .back-top{right:16px;bottom:140px;width:40px;height:40px;font-size:16px}

  /* Sticky call banner */
  .sticky-call{font-size:14px;padding:12px}

  /* FAQ button */
  .faq-btn{font-size:14px !important;padding:16px 18px !important}
  .faq-content.open{padding:16px 18px !important}

  /* Gallery filter buttons wrap */
  .gallery-filters{gap:8px !important}
  .gallery-filters button{font-size:12px !important;padding:7px 14px !important}

  /* Service areas chips */
  .city-chip{padding:10px 14px;font-size:13px}

  /* Testimonial card padding */
  .testimonial-card{padding:24px !important}

  /* Before/After height */
  .before-after-inner{height:260px !important}

  /* Stats grid 2-col on tablet */
  .stats-inner{grid-template-columns:repeat(2,1fr) !important}
  .stats-inner > div:nth-child(even){border-right:none !important}
  .stats-inner > div:nth-child(odd){border-right:1px solid rgba(255,255,255,0.07) !important}
  .stat-num{font-size:40px !important}

  /* Footer grid */
  .footer-grid{grid-template-columns:1fr 1fr !important;gap:32px !important}

  /* Section tag */
  .section-tag{font-size:11px;padding:5px 12px}
}

/* ── 640px: Small phones ── */
@media(max-width:640px){
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr !important}

  section{padding:60px 16px !important}

  /* Hero badge */
  .hero-badge{font-size:11px;padding:8px 14px;gap:8px}

  /* Stat numbers */
  .stat-num{font-size:34px !important}

  /* Stats: 2-col still fine on small mobile */
  .stats-inner{grid-template-columns:repeat(2,1fr) !important}

  /* Form inputs bigger tap target */
  input,textarea,select{font-size:16px !important;padding:13px 14px !important}

  /* Contact form – full single column */
  .form-row-2{grid-template-columns:1fr !important}

  /* Footer: single column */
  .footer-grid{grid-template-columns:1fr !important;gap:28px !important}

  /* Mobile menu font size */
  .mobile-menu a{font-size:22px}

  /* Gallery grid single col */
  .gallery-grid{grid-template-columns:1fr !important}

  /* Before/After height */
  .before-after-inner{height:220px !important}

  /* Why Us feature cards 1-col */
  .why-cards{grid-template-columns:1fr !important}

  /* About checklist 1-col */
  .about-checklist{grid-template-columns:1fr !important}

  /* Hero trust strip */
  .hero-trust-strip{gap:12px !important}
  .hero-trust-strip > div{font-size:12px !important}

  /* Service card padding */
  .service-card{padding:22px !important}

  /* Icon box */
  .icon-box{width:48px;height:48px;font-size:20px}

    .banner-mobile  { display: block; }
  .banner-desktop { display: none;  }
}

/* ── 480px: Very small phones ── */
@media(max-width:480px){
  section{padding:52px 14px !important}

  h1{font-size:clamp(30px,10vw,42px) !important}
  h2{font-size:clamp(22px,8vw,32px) !important}

  .hero-badge{flex-wrap:wrap;justify-content:center;text-align:center}

  /* Emergency banner single line wrap */
  .emergency-banner{font-size:10px !important}
  .emergency-banner a{display:block;margin-top:4px}

  /* Testimonial card */
  .testimonial-card{padding:20px !important}

  /* Stat */
  .stat-num{font-size:30px !important}

  /* Nav inner */
  .nav-inner{padding:0 14px !important}

  /* City chip */
  .city-chip{font-size:12px;padding:9px 12px}

  /* WhatsApp btn */
  .whatsapp-btn{width:48px;height:48px;right:14px;bottom:70px}
  .whatsapp-btn::before{width:48px;height:48px}
  .back-top{right:14px;bottom:130px;width:38px;height:38px;font-size:14px}

  .sticky-call{font-size:13px;padding:11px}

  /* Glass padding */
  .glass{padding:18px !important}

  /* FAQ */
  .faq-btn{font-size:13px !important;padding:14px 16px !important}

  /* Footer */
  .footer-grid{grid-template-columns:1fr !important}
}

/* ── Prevent image overflow ── */
img{max-width:100%;height:auto;display:block}

/* ── Overflow guard ── */
body,html{overflow-x:hidden}

/* ── Large screens: expand grids ── */
@media(min-width:1280px){
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-4{grid-template-columns:repeat(4,1fr)}
}
</style>

// ── Hooks ─────────────────────────────────────────────────────────────────────
function useScrollProgress() {
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    const handler = () => {
      const el = document.documentElement;
      setProgress((el.scrollTop / (el.scrollHeight - el.clientHeight)) * 100);
    };
    window.addEventListener('scroll', handler, { passive: true });
    return () => window.removeEventListener('scroll', handler);
  }, []);
  return progress;
}

function useInView(threshold = 0.15) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const observer = new IntersectionObserver(([e]) => { if (e.isIntersecting) setInView(true); }, { threshold });
    if (ref.current) observer.observe(ref.current);
    return () => observer.disconnect();
  }, []);
  return [ref, inView];
}

function useCounter(target, inView, duration = 2000) {
  const [count, setCount] = useState(0);
  useEffect(() => {
    if (!inView) return;
    let start = 0;
    const step = Math.ceil(target / (duration / 16));
    const timer = setInterval(() => {
      start += step;
      if (start >= target) { setCount(target); clearInterval(timer); }
      else setCount(start);
    }, 16);
    return () => clearInterval(timer);
  }, [inView, target, duration]);
  return count;
}

// ── Responsive hook ─────────────────────────────────────────────────────────
function useWindowWidth() {
  const [w, setW] = useState(typeof window !== 'undefined' ? window.innerWidth : 1280);
  useEffect(() => {
    const h = () => setW(window.innerWidth);
    window.addEventListener('resize', h, { passive: true });
    return () => window.removeEventListener('resize', h);
  }, []);
  return w;
}

function BeforeAfter() {
  const [pos, setPos] = useState(50);
  const [ref, inView] = useInView(0.2);
  const drag = useRef(false);
  const container = useRef(null);

  const move = (clientX) => {
    if (!drag.current || !container.current) return;
    const rect = container.current.getBoundingClientRect();
    const p = Math.min(Math.max(((clientX - rect.left) / rect.width) * 100, 5), 95);
    setPos(p);
  };

  return (
    <section ref={ref} style={{padding:'80px 24px',background:'#0B1220'}}>
      <div className="container">
        <div style={{textAlign:'center',marginBottom:48}}>
          <div className="section-tag">Transformations</div>
          <h2 className="font-display" style={{fontSize:'clamp(24px,3.5vw,44px)',fontWeight:800,marginBottom:12}}>
            Before & <span className="gradient-text">After</span>
          </h2>
          <p style={{color:'rgba(255,255,255,0.5)',fontSize:'clamp(13px,2vw,16px)'}}>Drag to compare — outdated panels to modern upgrades</p>
        </div>
        <div style={{maxWidth:700,margin:'0 auto',borderRadius:20,overflow:'hidden',border:'1px solid rgba(255,255,255,0.08)',userSelect:'none'}}>
          <div className="before-after-inner" ref={container}
            style={{position:'relative',height:360,cursor:'ew-resize'}}
            onMouseDown={e => { drag.current = true; move(e.clientX); }}
            onMouseUp={() => { drag.current = false; }}
            onMouseLeave={() => { drag.current = false; }}
            onMouseMove={e => move(e.clientX)}
            onTouchStart={e => { drag.current = true; }}
            onTouchEnd={() => { drag.current = false; }}
            onTouchMove={e => move(e.touches[0].clientX)}>
            <div style={{position:'absolute',inset:0,background:'linear-gradient(135deg,#1a0a0a,#3d1a1a)',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <div style={{textAlign:'center'}}>
                <div style={{fontSize:'clamp(32px,6vw,48px)',marginBottom:12,opacity:.5}}>🔧</div>
                <div style={{fontSize:'clamp(20px,5vw,32px)',fontFamily:'Syne,sans-serif',fontWeight:800,color:'rgba(255,100,100,0.6)'}}>BEFORE</div>
                <div style={{color:'rgba(255,255,255,0.3)',fontSize:'clamp(11px,2vw,14px)',marginTop:8}}>Outdated 60A fuse panel</div>
              </div>
            </div>
            <div style={{position:'absolute',inset:0,clipPath:`inset(0 ${100-pos}% 0 0)`,background:'linear-gradient(135deg,#0d1f3c,#1a3060)',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <div style={{textAlign:'center'}}>
                <div style={{fontSize:'clamp(32px,6vw,48px)',marginBottom:12,opacity:.7}}>⚡</div>
                <div style={{fontSize:'clamp(20px,5vw,32px)',fontFamily:'Syne,sans-serif',fontWeight:800,color:'rgba(96,165,250,0.8)'}}>AFTER</div>
                <div style={{color:'rgba(255,255,255,0.5)',fontSize:'clamp(11px,2vw,14px)',marginTop:8}}>Modern 200A breaker panel</div>
              </div>
            </div>
            <div style={{position:'absolute',top:0,bottom:0,left:`${pos}%`,transform:'translateX(-50%)',width:3,background:'#2563EB',zIndex:10}}>
              <div style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',width:44,height:44,background:'#2563EB',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,boxShadow:'0 0 20px rgba(37,99,235,0.6)',cursor:'ew-resize',userSelect:'none'}}>⟺</div>
            </div>
            <div style={{position:'absolute',top:16,left:16,background:'rgba(200,0,0,0.7)',borderRadius:6,padding:'4px 12px',fontSize:12,fontWeight:700}}>BEFORE</div>
            <div style={{position:'absolute',top:16,right:16,background:'rgba(37,99,235,0.8)',borderRadius:6,padding:'4px 12px',fontSize:12,fontWeight:700}}>AFTER</div>

  );
}
